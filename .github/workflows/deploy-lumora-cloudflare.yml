# Legacy release path only. Netlify builds do not invoke this workflow.
name: Legacy Cloudflare release (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-lumora-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, build, and deploy
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build OpenNext Worker
        run: npm run cf:build
        env:
          NEXTJS_ENV: production
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Lumora' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          WATCH_PARTY_WORKER_URL: ${{ vars.WATCH_PARTY_WORKER_URL }}

      - name: Validate Worker upload
        run: npm run cf:dry-run:built

      - name: Validate bindings and deploy production Worker
        shell: bash
        env:
          NEXTJS_ENV: production
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          NEXT_PUBLIC_APP_NAME: ${{ vars.NEXT_PUBLIC_APP_NAME || 'Lumora' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_API_BASE_URL: ${{ vars.TMDB_API_BASE_URL || 'https://api.themoviedb.org/3' }}
          WYZIE_API_KEY: ${{ secrets.WYZIE_API_KEY }}
          WYZIE_SUBTITLE_TOKEN_SECRET: ${{ secrets.WYZIE_SUBTITLE_TOKEN_SECRET }}
          VIDNEST_API_SECRET: ${{ secrets.VIDNEST_API_SECRET }}
          WATCH_PARTY_SECRET: ${{ secrets.WATCH_PARTY_SECRET }}
          WATCH_PARTY_WORKER_URL: ${{ vars.WATCH_PARTY_WORKER_URL }}
          ADSTERRA_KEY_LEADERBOARD: ${{ vars.ADSTERRA_KEY_LEADERBOARD }}
          ADSTERRA_KEY_RECTANGLE: ${{ vars.ADSTERRA_KEY_RECTANGLE }}
          ADSTERRA_KEY_PREROLL: ${{ vars.ADSTERRA_KEY_PREROLL }}
          RUNTIME_SECRETS_FILE: ${{ runner.temp }}/lumora-runtime-secrets.json
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNTIME_SECRETS_FILE"' EXIT
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { validateRuntimeBindings } from './scripts/deploy-cloudflare.mjs';
          const required = ['CLOUDFLARE_ACCOUNT_ID', 'CLOUDFLARE_API_TOKEN'];
          const missing = required.filter((name) => !process.env[name]?.trim());
          if (missing.length) throw new Error(`Missing required GitHub production variables/secrets: ${missing.join(', ')}`);
          const bindings = validateRuntimeBindings(process.env);
          fs.writeFileSync(process.env.RUNTIME_SECRETS_FILE, JSON.stringify(bindings), { mode: 0o600, flag: 'wx' });
          NODE
          npm run cf:deploy:built -- --secrets-file="$RUNTIME_SECRETS_FILE"
